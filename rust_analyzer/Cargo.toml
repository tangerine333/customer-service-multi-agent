[package]
name = "rust-analyzer"
version = "0.1.0"
edition = "2021"
description = "Code analysis engine with tree-sitter parsing, call graph, taint analysis"

[lib]
name = "rust_analyzer"
crate-type = ["cdylib"]

[dependencies]
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-java = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.21", features = ["extension-module"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
rayon = "1.9"
petgraph = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
